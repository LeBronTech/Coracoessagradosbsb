<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Clip globe to sphere -->
    <clipPath id="globe-clip-europa">
      <circle cx="32" cy="32" r="27" />
    </clipPath>

    <!-- Deep Ocean Gradient -->
    <radialGradient id="ocean-europa" cx="32%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="55%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </radialGradient>

    <!-- Emerald Landmass Gradient -->
    <linearGradient id="land-europa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>

    <!-- 3D Atmospheric Shadow on Sphere Edge -->
    <radialGradient id="shadow-europa" cx="50%" cy="50%" r="50%">
      <stop offset="72%" stop-color="#0F172A" stop-opacity="0" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.35" />
    </radialGradient>

    <!-- Top Gloss Specular Highlight -->
    <linearGradient id="gloss-europa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Drop Shadow behind Globe for Depth -->
  <circle cx="32" cy="33.5" r="27" fill="#0F172A" fill-opacity="0.1" />

  <!-- Ocean Sphere Base -->
  <circle cx="32" cy="32" r="27" fill="url(#ocean-europa)" />

  <!-- Landmasses -->
  <g clip-path="url(#globe-clip-europa)" fill="url(#land-europa)" stroke="#15803D" stroke-width="0.35">
    <path d="M 19 23 C 18 25 19 27 21 27 C 22 25 21 23 19 23 Z" />
    <path d="M 23 18 C 24 16 26 17 26 21 C 26 24 25 27 23 28 C 22 26 23 23 23 18 Z" />
    <path d="M 30 11 C 32 9 35 10 36 13 C 35 17 33 21 31 22 C 30 20 30 16 29 13 Z" />
    <path d="M 35 14 C 38 13 40 16 39 19 C 37 20 35 18 35 14 Z" />
    <path d="M 17 33 C 21 32 23 34 22 38 C 19 40 16 39 17 33 Z" />
    <path d="M 23 27 C 27 25 33 26 34 29 C 33 33 28 34 24 33 C 23 31 22 29 23 27 Z" />
    <path d="M 30 32 C 32 33 33 37 35 39 C 34 40 33 38 31 35 C 30 34 29 33 30 32 Z" />
    <path d="M 33 42 C 34.5 41 35.5 42.5 34 43.5 Z" />
    <path d="M 35 32 C 39 31 41 35 39 39 C 38 41 36 40 35 36 Z" />
    <path d="M 34 16 C 42 13 52 15 58 21 C 58 28 53 34 46 33 C 39 32 35 27 34 21 Z" />
    <path d="M 40 36 C 46 35 50 36 50 40 C 46 41 41 40 40 36 Z" />
    <path d="M 10 42 C 22 40 38 42 54 44 C 55 51 47 57 36 59 C 23 60 13 55 8 47 Z" />
  </g>

  <!-- 3D Globe Edge Shadow -->
  <circle cx="32" cy="32" r="27" fill="url(#shadow-europa)" pointer-events="none" />

  <!-- Spherical Gloss Reflection Highlight -->
  <ellipse cx="25" cy="18" rx="14" ry="7" fill="url(#gloss-europa)" transform="rotate(-25 25 18)" pointer-events="none" clip-path="url(#globe-clip-europa)" />

  <!-- Polished Outer Rim -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#BAE6FD" stroke-width="1.2" stroke-opacity="0.65" />
</svg>
