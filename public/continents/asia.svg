<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Clip globe to sphere -->
    <clipPath id="globe-clip-asia">
      <circle cx="32" cy="32" r="27" />
    </clipPath>

    <!-- Deep Ocean Gradient -->
    <radialGradient id="ocean-asia" cx="32%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="55%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </radialGradient>

    <!-- Emerald Landmass Gradient -->
    <linearGradient id="land-asia" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#16A34A" />
    </linearGradient>

    <!-- 3D Atmospheric Shadow on Sphere Edge -->
    <radialGradient id="shadow-asia" cx="50%" cy="50%" r="50%">
      <stop offset="72%" stop-color="#0F172A" stop-opacity="0" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.35" />
    </radialGradient>

    <!-- Top Gloss Specular Highlight -->
    <linearGradient id="gloss-asia" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Drop Shadow behind Globe for Depth -->
  <circle cx="32" cy="33.5" r="27" fill="#0F172A" fill-opacity="0.1" />

  <!-- Ocean Sphere Base -->
  <circle cx="32" cy="32" r="27" fill="url(#ocean-asia)" />

  <!-- Landmasses -->
  <g clip-path="url(#globe-clip-asia)" fill="url(#land-asia)" stroke="#15803D" stroke-width="0.35">
    <path d="M 14 13 C 28 8 46 8 58 15 C 57 23 49 26 40 26 C 30 25 21 22 14 16 Z" />
    <path d="M 20 21 C 32 19 44 20 52 25 C 53 33 46 37 36 37 C 25 36 18 29 20 21 Z" />
    <path d="M 52 21 C 55 22 56 27 54 31 C 52 30 51 26 52 21 Z" />
    <path d="M 47 25 C 49 25 49 29 47 30 C 46 29 46 26 47 25 Z" />
    <path d="M 23 31 C 27 30 31 32 31 36 C 29 43 27 45 25 41 C 23 37 22 33 23 31 Z" />
    <path d="M 27 44 C 28.5 43 29.5 44.5 28 45.5 Z" />
    <path d="M 37 33 C 41 32 44 36 43 42 C 40 44 38 41 37 36 Z" />
    <path d="M 35 47 C 42 46 48 47 52 49 C 48 51 40 50 35 47 Z" />
    <path d="M 43 43 C 47 42 48 45 44 46 Z" />
    <path d="M 49 34 C 52 33 53 38 50 40 Z" />
    <path d="M 10 27 C 16 26 18 31 17 37 C 12 40 8 35 10 27 Z" />
  </g>

  <!-- 3D Globe Edge Shadow -->
  <circle cx="32" cy="32" r="27" fill="url(#shadow-asia)" pointer-events="none" />

  <!-- Spherical Gloss Reflection Highlight -->
  <ellipse cx="25" cy="18" rx="14" ry="7" fill="url(#gloss-asia)" transform="rotate(-25 25 18)" pointer-events="none" clip-path="url(#globe-clip-asia)" />

  <!-- Polished Outer Rim -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#BAE6FD" stroke-width="1.2" stroke-opacity="0.65" />
</svg>
